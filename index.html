<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Раскладка — конвертер текста</title>
<meta name="description" content="Перевод текста между русской и английской раскладкой клавиатуры: привет ↔ ghbdtn.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121520'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' fill='%23b9ff66'%3EЯ%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10121b;color:#f4f5fa}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:36px 20px}main{max-width:940px;margin:auto}header{display:flex;align-items:center;gap:14px;margin-bottom:36px}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#b9ff66;color:#10121b;font-weight:800;font-size:24px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1px;margin:0}header p{margin:5px 0 0;color:#a6aec3;font-size:16px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}select,button{font:inherit;font-size:16px;border-radius:12px;min-height:48px;padding:10px 16px;border:1px solid #394157;background:#202534;color:#f4f5fa;cursor:pointer}select{flex:1;min-width:190px}button:hover{background:#30374b}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b9ff66;outline-offset:3px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:20px;background:#191d2a;border:1px solid #30374a;border-radius:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}label{font-weight:600;font-size:16px}.count{font-size:14px;color:#a6aec3}textarea{width:100%;min-height:290px;resize:vertical;border:0;background:transparent;color:#f4f5fa;font:18px/1.65 system-ui;outline:none;padding:10px 0}textarea::placeholder{color:#8790a9}#output{color:#b9ff66}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}#copy{background:#b9ff66;color:#10121b;font-weight:650;border:0}#copy:hover{background:#ccff93}#status{color:#a6aec3;font-size:14px;min-height:22px;margin:14px 0}footer{font-size:14px;color:#8790a9;margin-top:24px;line-height:1.6}@media(max-width:650px){body{padding:24px 16px}header{margin-bottom:26px}.panels{grid-template-columns:1fr;gap:14px}.panel{padding:16px}textarea{min-height:160px}.controls button{flex:1}select{flex-basis:100%}}
</style>
</head>
<body><main>
<header><div class="mark" aria-hidden="true">Я</div><div><h1>Раскладка</h1><p>привет ↔ ghbdtn</p></div></header>
<div class="controls"><select id="direction" aria-label="Направление конвертации"><option value="auto">Автоматически: RU ↔ EN</option><option value="ru-en">Русская → английская</option><option value="en-ru">Английская → русская</option></select><button id="swap">Поменять местами</button></div>
<div class="panels"><section class="panel"><div class="panel-head"><label for="input">Исходный текст</label><span id="count" class="count">0 символов</span></div><textarea id="input" placeholder="Введи или вставь текст…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="actions"><button id="paste">Вставить</button><button id="clear">Очистить</button></div></section>
<section class="panel"><div class="panel-head"><label for="output">Результат</label><span class="count">Без транслитерации</span></div><textarea id="output" placeholder="Здесь появится результат" readonly spellcheck="false"></textarea><div class="actions"><button id="copy">Скопировать</button></div></section></div>
<p id="status" role="status" aria-live="polite"></p><footer>Текст обрабатывается на твоём устройстве и никуда не отправляется. Регистр и переносы строк сохраняются.</footer>
</main><script src="app.js"></script></body></html>
